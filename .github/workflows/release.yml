name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish binaries
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      # Pure Go, so every target cross-compiles from one runner with no C
      # toolchain. The Windows icon comes from the committed .syso resources,
      # which the linker picks up per architecture.
      - name: Build every target
        run: |
          set -eu
          mkdir -p dist

          build() {   # os arch suffix extra-ldflags
            echo "building $1/$2 $4"
            GOOS="$1" GOARCH="$2" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "-X main.defaultMode=release -s -w $4" \
              -o "dist/WoL-go-$1-$2$3" .
          }

          build linux   amd64 ""   ""
          build linux   386   ""   ""
          build linux   arm   ""   ""
          build linux   arm64 ""   ""
          build darwin  amd64 ""   ""
          build darwin  arm64 ""   ""
          build windows amd64 .exe ""
          build windows 386   .exe ""
          build windows arm64 .exe ""

          # Tray builds are the same program linked for the GUI subsystem, so
          # Windows gives them no console window.
          build windows amd64 -tray.exe "-H windowsgui"
          build windows 386   -tray.exe "-H windowsgui"
          build windows arm64 -tray.exe "-H windowsgui"

          ls -l dist

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
