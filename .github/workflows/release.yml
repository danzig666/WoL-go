name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish binaries
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      # Pure Go, so every target cross-compiles from one runner with no C
      # toolchain. The Windows icon comes from the committed .syso resources,
      # which the linker picks up per architecture.
      - name: Build every target
        run: |
          set -eu
          mkdir -p dist

          # The tag is stamped into every binary. It is what the update
          # mechanism compares, so an unstamped build would offer to update
          # itself forever.
          VERSION="${GITHUB_REF_NAME}"
          echo "building $VERSION"

          build() {   # os arch suffix extra-ldflags
            echo "building $1/$2 $4"
            GOOS="$1" GOARCH="$2" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "-X main.defaultMode=release -X main.appVersion=$VERSION -s -w $4" \
              -o "dist/WoL-go-$1-$2$3" .
          }

          build linux   amd64 ""   ""
          build linux   386   ""   ""
          build linux   arm   ""   ""
          build linux   arm64 ""   ""
          build darwin  amd64 ""   ""
          build darwin  arm64 ""   ""
          build windows amd64 .exe ""
          build windows 386   .exe ""
          build windows arm64 .exe ""

          # Tray builds are the same program linked for the GUI subsystem, so
          # Windows gives them no console window.
          build windows amd64 -tray.exe "-H windowsgui"
          build windows 386   -tray.exe "-H windowsgui"
          build windows arm64 -tray.exe "-H windowsgui"

          # The sleep agent, which runs on the computers being woken. Windows
          # only: suspending a machine and the service model are both platform
          # specific, and the package only has stubs elsewhere.
          agent() {
            echo "building agent windows/$1"
            GOOS=windows GOARCH="$1" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "-X main.version=$VERSION -s -w" \
              -o "dist/wol-agent-windows-$1.exe" ./cmd/wol-agent
          }
          agent amd64
          agent 386
          agent arm64

          ls -l dist

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # The signature is what lets an already-installed agent decide whether to
      # run a new binary. It verifies against the public key compiled into it,
      # so nothing between here and that machine - not even its own WoL-go
      # server - can substitute a different build.
      #
      # A release without this step still installs by hand, but no agent will
      # update itself from it.
      - name: Sign the checksums
        env:
          WOLGO_SIGNING_KEY: ${{ secrets.WOLGO_SIGNING_KEY }}
        run: |
          set -eu
          if [ -z "${WOLGO_SIGNING_KEY:-}" ]; then
            echo "::error::WOLGO_SIGNING_KEY is not set. Agents cannot update themselves from an unsigned release."
            exit 1
          fi
          go run ./tools/sign dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt.sig

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
